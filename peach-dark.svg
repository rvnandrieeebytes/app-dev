<svg xmlns="http://www.w3.org/2000/svg" width="500" height="60" viewBox="0 0 500 60">
  <defs>
    <clipPath id="wipe">
      <rect x="0" y="0" width="0" height="60">
        <animate attributeName="width" from="0" to="500" dur="3s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    text {
      font-family: 'Segoe Script', 'Brush Script MT', 'Snell Roundhand', 'Apple Chancery', cursive;
      font-size: 30px;
      fill: #FFE5B4;
      fill-opacity: 0;
      stroke: #FFE5B4;
      stroke-width: 1;
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: draw 2.5s ease forwards, fillin 0.8s ease 2.2s forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fillin { to { fill-opacity: 1; } }
  </style>
  <g clip-path="url(#wipe)">
    <text x="10" y="40">It's Peach himself!</text>
  </g>
</svg>
